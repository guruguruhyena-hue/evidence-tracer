name: Publish Evidence Tracer (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "valuation.html"
      - "valuation.js"
      - "valuation-audit.js"
      - "valuation-police-ui.js"
      - "valuation-worker.js"
      - "scripts/valuation-test.mjs"
      - "report.html"
      - "src/**"
      - "vendor/**"
      - "examples/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public code
        uses: actions/checkout@v4
      - name: Check valuation JavaScript syntax
        run: |
          node --check valuation.js
          node --check valuation-worker.js
          node --check valuation-audit.js
          node --check valuation-police-ui.js
          node scripts/valuation-test.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp valuation.js valuation-worker.js valuation-audit.js valuation-police-ui.js _site/
          test -d src && cp -R src _site/ || true
          test -d vendor && cp -R vendor _site/ || true
          test -f app.js && cp app.js _site/ || true
          test -f package.json && cp package.json _site/ || true
          test -d examples && cp -R examples _site/ || true
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
