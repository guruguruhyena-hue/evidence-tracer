name: Publish Evidence Tracer (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "guide.html"
      - "guide.js"
      - "flow-reconcile.html"
      - "flow-reconcile.js"
      - "flow-reconcile-ui.js"
      - "scripts/flow-reconcile-test.mjs"
      - "valuation.html"
      - "history-import.html"
      - "history-converter.js"
      - "history-import-ui.js"
      - "scripts/history-converter-test.mjs"
      - "valuation.js"
      - "historical-price-sources.js"
      - "shared-price-db.js"
      - "scripts/build-shared-price-cache.py"
      - "prices/**"
      - "valuation-audit.js"
      - "valuation-police-ui.js"
      - "valuation-worker.js"
      - "scripts/valuation-test.mjs"
      - "scripts/shared-cache-test.mjs"
      - "report.html"
      - "src/**"
      - "vendor/**"
      - "examples/**"
      - ".github/workflows/publish-pages.yml"
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public code
        uses: actions/checkout@v4
      - name: Check valuation JavaScript syntax
        run: |
          node --check valuation.js
          node --check history-converter.js
          node --check history-import-ui.js
          node --check flow-reconcile.js
          node --check flow-reconcile-ui.js
          node --check guide.js
          node scripts/flow-reconcile-test.mjs
          node scripts/history-converter-test.mjs
          node --check historical-price-sources.js
          node --check shared-price-db.js
          node --check valuation-worker.js
          node --check valuation-audit.js
          node --check valuation-police-ui.js
          node scripts/valuation-test.mjs
          node scripts/shared-cache-test.mjs
      - name: Refresh public IZAKA-YA historical price cache
        run: |
          python3 -m py_compile scripts/build-shared-price-cache.py
          python3 scripts/build-shared-price-cache.py || echo "::warning::Price refresh unavailable; deploy existing cache only"
      - name: Commit public price snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh IZAKA-YA daily JPY reference rates"
            git push origin HEAD:main
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp valuation.js valuation-worker.js valuation-audit.js valuation-police-ui.js historical-price-sources.js shared-price-db.js history-converter.js history-import-ui.js flow-reconcile.js flow-reconcile-ui.js guide.js _site/
          test -d src && cp -R src _site/ || true
          test -d vendor && cp -R vendor _site/ || true
          test -f app.js && cp app.js _site/ || true
          test -f package.json && cp package.json _site/ || true
          test -d examples && cp -R examples _site/ || true
          test -d prices && cp -R prices _site/ || true
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
